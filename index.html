<!DOCTYPE html>

<style>
:root{
  --bg:#FBF8F1; --card:#FFFFFF; --text:#33302B; --sub:#8C8577;
  --accent:#E8821E; --line:#E7DFD2;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  line-height:1.7;-webkit-text-size-adjust:100%}
.wrap{max-width:680px;margin:0 auto;padding:28px 18px 64px}
header{text-align:center;padding:8px 0 24px;border-bottom:3px solid var(--accent)}
h1{font-size:22px;margin:0 0 6px;font-weight:800}
header p{margin:0;color:var(--sub);font-size:14px}
header a{color:var(--accent);text-decoration:none;font-weight:700}
.video{margin:32px 0 0}
.video h2{font-size:17px;margin:0 0 2px;font-weight:700;overflow-wrap:anywhere}
.item .name,.wrap{overflow-wrap:anywhere}
.date{color:var(--sub);font-size:13px;margin:0 0 12px}
.item{display:block;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:15px 17px;margin:0 0 10px;text-decoration:none;color:inherit}
.item:hover{border-color:var(--accent)}
.item .name{font-size:15px;font-weight:600}
.item .go{color:var(--accent);font-size:13px;font-weight:700;margin-top:5px}
.empty{color:var(--sub);text-align:center;padding:40px 0}
footer{margin-top:48px;padding-top:18px;border-top:1px solid var(--line);
  color:var(--sub);font-size:12px}
@media (prefers-color-scheme:dark){
  :root{--bg:#23211E;--card:#2E2B27;--text:#F2EEE6;--sub:#A9A196;--line:#3D3933}
}
</style>
</head>
